slug: brocoli-salteado-con-ajo-y-huevo
name: Brócoli salteado con ajo y huevo
description: Brócoli al punto con ajo dorado y huevo a la plancha.
servings_base: 2
time_min: 20
meal_types: [cena]
tags: [rapida, revisar]
styles: [mediterraneo, vegetariano, sin_gluten, sin_lactosa]
allergens: [huevos]
cost_level: bajo
protein_group: huevo
ingredients:
  - { ingredient: brocoli, quantity: 400, unit: g }
  - { ingredient: huevos, quantity: 2, unit: ud }
  - { ingredient: ajo, quantity: 2, unit: diente }
  - { ingredient: aceite-oliva, quantity: 2, unit: cda }
  - { ingredient: pimenton-dulce, quantity: 1, unit: pizca, optional: true }
  - { ingredient: sal, quantity: 1, unit: pizca }
steps:
  - Cuece el brócoli 5 minutos y escurre.
  - Dora el ajo laminado en el aceite y saltea el brócoli 3 minutos.
  - Haz los huevos a la plancha y sirve encima.
