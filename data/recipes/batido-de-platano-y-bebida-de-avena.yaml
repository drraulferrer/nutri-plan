ingredients:
  - { ingredient: bebida-avena, quantity: 400, unit: ml }
  - { ingredient: platano, quantity: 2, unit: ud }
  - { ingredient: avena-copos, quantity: 30, unit: g }
  - { ingredient: canela, quantity: 1, unit: pizca, optional: true }
steps:
  - Pela los plátanos y trocéalos.
  - Tritura con la bebida de avena y los copos hasta que quede fino.
  - Sirve frío, con canela si quieres.
