slug: batido-de-platano-y-bebida-de-avena
name: Batido de plátano y avena
description: Batido vegetal con plátano, ideal para llevar.
servings_base: 2
time_min: 5
meal_types: [desayuno, tentempie]
tags: [rapida, sin_cocinar, economica, revisar]
