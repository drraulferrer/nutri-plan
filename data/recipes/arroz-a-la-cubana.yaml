slug: arroz-a-la-cubana
name: Arroz a la cubana
description: Arroz blanco, salsa de tomate y huevo a la plancha.
servings_base: 2
time_min: 20
meal_types: [comida, cena]
tags: [rapida, economica, revisar]
styles: [mediterraneo, vegetariano, sin_gluten, sin_lactosa]
allergens: [huevos]
cost_level: bajo
protein_group: huevo
ingredients:
  - { ingredient: arroz, quantity: 180, unit: g }
  - { ingredient: huevos, quantity: 2, unit: ud }
  - { ingredient: tomate-triturado, quantity: 200, unit: g }
  - { ingredient: ajo, quantity: 1, unit: diente }
  - { ingredient: platano, quantity: 1, unit: ud, optional: true }
  - { ingredient: aceite-oliva, quantity: 2, unit: cda }
  - { ingredient: sal, quantity: 1, unit: pizca }
steps:
  - Cuece el arroz.
  - Sofríe el ajo, añade el tomate y cocina 8 minutos con sal.
  - Haz los huevos a la plancha (y el plátano en rodajas si lo usas). Sirve todo junto.
substitutions:
  - { ingredient: huevos, with: tofu, note: a la plancha, versión vegana }
author: Borrador para revisión
