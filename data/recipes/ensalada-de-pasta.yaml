slug: ensalada-de-pasta
name: Ensalada de pasta
description: Pasta fría con tomate, atún, maíz y pepino.
servings_base: 2
time_min: 20
meal_types: [comida, cena]
tags: [economica, revisar]
styles: [mediterraneo, sin_lactosa]
allergens: [gluten, pescado]
cost_level: bajo
protein_group: pescado
ingredients:
  - { ingredient: pasta, quantity: 200, unit: g }
  - { ingredient: tomate, quantity: 2, unit: ud }
  - { ingredient: atun, quantity: 2, unit: lata }
  - { ingredient: maiz, quantity: 1, unit: lata }
  - { ingredient: pepino, quantity: 0.5, unit: ud }
  - { ingredient: aceitunas, quantity: 40, unit: g, optional: true }
  - { ingredient: aceite-oliva, quantity: 2, unit: cda }
  - { ingredient: vinagre, quantity: 1, unit: cda }
steps:
  - Cuece la pasta, escúrrela y enfríala con agua.
  - Pica el tomate y el pepino; escurre el atún y el maíz.
  - Mezcla todo y aliña con aceite y vinagre.
substitutions:
  - { ingredient: atun, with: garbanzos-cocidos, note: versión vegana }
author: Borrador para revisión
