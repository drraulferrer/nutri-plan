slug: macedonia-de-fruta-con-canela
name: Macedonia de fruta con canela
description: Fruta troceada con zumo de naranja. Vegana, sin gluten y sin alérgenos.
servings_base: 2
time_min: 10
meal_types: [desayuno, tentempie]
tags: [rapida, sin_cocinar, economica, revisar]
styles: [mediterraneo, vegetariano, vegano, sin_gluten, sin_lactosa]
allergens: []
cost_level: bajo
protein_group: ninguno
ingredients:
  - { ingredient: naranja, quantity: 2, unit: ud }
  - { ingredient: manzana, quantity: 1, unit: ud }
  - { ingredient: platano, quantity: 1, unit: ud }
  - { ingredient: canela, quantity: 1, unit: pizca, optional: true }
steps:
  - Exprime una naranja y reserva el zumo.
  - Pela y trocea el resto de la fruta en dados pequeños.
  - Mezcla con el zumo y espolvorea la canela.
substitutions:
  - { ingredient: manzana, with: pepino, note: para una versión menos dulce }
tip: El zumo de naranja evita que la manzana se oscurezca.
author: Borrador para revisión
