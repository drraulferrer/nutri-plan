slug: sardinas-al-horno-con-tomate
name: Sardinas al horno
description: Sardinas con tomate y ajo, al horno y sin manchar.
servings_base: 2
time_min: 25
meal_types: [comida, cena]
tags: [economica, revisar]
styles: [mediterraneo, sin_gluten, sin_lactosa]
allergens: [pescado]
cost_level: bajo
protein_group: pescado
ingredients:
  - { ingredient: sardinas, quantity: 400, unit: g }
  - { ingredient: tomate, quantity: 3, unit: ud }
  - { ingredient: ajo, quantity: 2, unit: diente }
  - { ingredient: limon, quantity: 0.5, unit: ud }
  - { ingredient: aceite-oliva, quantity: 2, unit: cda }
  - { ingredient: perejil, quantity: 1, unit: pizca, optional: true }
  - { ingredient: sal, quantity: 1, unit: pizca }
steps:
  - Precalienta el horno a 200 °C.
  - Coloca las sardinas limpias sobre las rodajas de tomate, con el ajo picado, el aceite y la sal.
  - Hornea 15 minutos. Termina con limón y perejil.
substitutions:
  - { ingredient: sardinas, with: merluza, note: reduce el horno a 12 minutos }
